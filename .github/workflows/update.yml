name: Update site list

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch: {} # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - "scripts/generate.mjs"
      - "descriptions.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-site-list
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate.mjs

      - name: Commit changes if the list moved
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Auto-update site list"
            git push
          else
            echo "No changes — site list already up to date."
          fi
